<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04261B"/>
      <stop offset="50%" stop-color="#064632"/>
      <stop offset="100%" stop-color="#021C14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="40%" stop-color="#E5C578"/>
      <stop offset="80%" stop-color="#D8B45A"/>
      <stop offset="100%" stop-color="#A57D2C"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Ornate Golden Border Ring -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  <rect x="30" y="30" width="452" height="452" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.5"/>

  <!-- Crescent Moon -->
  <path d="M256,90 C180,90 120,150 120,226 C120,302 180,362 256,362 C285,362 312,353 334,337 C270,323 222,266 222,198 C222,143 252,98 296,82 C283,86 270,90 256,90 Z" fill="url(#goldGrad)"/>

  <!-- Kaaba Silhouette in center -->
  <g transform="translate(206, 175)">
    <!-- Base Cube -->
    <polygon points="50,15 95,35 95,95 50,75" fill="#1C1B18"/>
    <polygon points="50,15 5,35 5,95 50,75" fill="#111111"/>
    <polygon points="50,15 5,35 50,55 95,35" fill="#2E2D28"/>
    <!-- Kiswa Gold Band -->
    <polygon points="5,48 50,68 50,73 5,53" fill="url(#goldGrad)"/>
    <polygon points="50,68 95,48 95,53 50,73" fill="url(#goldGrad)"/>
    <!-- Door (Bab Al-Kaaba) -->
    <rect x="62" y="55" width="12" height="26" rx="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Star -->
  <polygon points="325,135 330,147 343,147 332,155 336,167 325,159 314,167 318,155 307,147 320,147" fill="url(#goldGrad)"/>

  <!-- Brand Typography -->
  <!-- AL HINDWAN -->
  <text x="256" y="390" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">AL-HINDWAN</text>
  
  <!-- TOURS & TRAVELS -->
  <text x="256" y="426" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">TOURS &amp; TRAVELS</text>
  
  <!-- Subtitle -->
  <text x="256" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">UMRAH SERVICES</text>
</svg>
