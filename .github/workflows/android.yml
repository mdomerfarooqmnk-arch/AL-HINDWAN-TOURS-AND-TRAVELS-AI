```yaml
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android Project
        shell: bash
        run: |
          echo "Repository files:"
          ls -la
          echo "Searching for Gradle settings..."
          find . -maxdepth 4 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -print

      - name: Generate Gradle Wrapper if Missing
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
              gradle wrapper
            else
              echo "ERROR: No Gradle project found in repository root."
              echo "Move the Android project files to the root or set the correct project directory."
              exit 1
            fi
          fi

          chmod +x gradlew
          ls -la gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Al-Hindwan-Android-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
```
