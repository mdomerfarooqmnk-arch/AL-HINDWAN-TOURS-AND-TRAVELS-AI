
      - name: Find APK
        if: always()
        run: |
          echo "Current directory:"
          pwd
          echo "Files in Android folder:"
          ls -la android
          echo "Searching all APK files:"
          find . -type f -name "*.apk" -print
          echo "Checking Gradle build output:"
          find android -type d -path "*/build/outputs/*" -print
