
      - name: Find APK
        if: success()
        run: |
          echo "Searching for generated APK files..."
          find android -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AL-HINDWAN-Umrah-APK
          path: android/**/*.apk
          if-no-files-found: error
          retention-days: 14
