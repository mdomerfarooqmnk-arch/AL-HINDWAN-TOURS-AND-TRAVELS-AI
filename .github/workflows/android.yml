```yaml
name: AL HINDWAN Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Project Structure
        run: |
          echo "Repository contents:"
          ls -la
          echo "Android folder:"
          ls -la android || true
          echo "Gradle settings:"
          find . -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -print

      - name: Build Android APK
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f android/gradlew ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: Gradle wrapper not found."
            echo "Check the Android project folder and Gradle files."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AL-HINDWAN-Android-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
```
