name: AL HINDWAN Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Umrah Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android Files
        run: |
          echo "Checking Android project"
          ls -la android
          ls -la android/app

      - name: Build Android APK
        shell: bash
        run: |
          cd android
          if [ ! -f gradlew ]; then
            if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
              gradle wrapper
            else
              echo "ERROR: Gradle settings file is missing in android folder."
              exit 1
            fi
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AL-HINDWAN-Umrah-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
