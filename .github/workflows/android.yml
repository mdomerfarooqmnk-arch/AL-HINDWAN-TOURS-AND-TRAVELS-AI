```yaml
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android Project
        shell: bash
        run: |
          echo "Checking project files..."
          pwd
          ls -la
          find . -maxdepth 4 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -print

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
              gradle wrapper
            else
              echo "ERROR: Gradle project not found in repository root."
              echo "Check whether the Android project is inside a subfolder."
              exit 1
            fi
          fi

          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Al-Hindwan-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
```
