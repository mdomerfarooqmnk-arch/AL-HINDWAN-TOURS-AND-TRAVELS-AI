```yaml
name: Android CI - Build APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Project Files
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          ls -la
          echo "Searching for Gradle settings:"
          find . -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -print

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
              gradle wrapper
            else
              echo "ERROR: Gradle project not found in repository root."
              echo "Check the project folder structure."
              exit 1
            fi
          fi

          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
```
