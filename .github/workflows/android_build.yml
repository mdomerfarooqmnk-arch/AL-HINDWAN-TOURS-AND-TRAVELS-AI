```yaml
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Project Files
        shell: bash
        run: |
          echo "Checking repository files..."
          pwd
          ls -la
          echo "Searching for Android Gradle settings..."
          find . -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -print

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
              echo "Generating Gradle Wrapper..."
              gradle wrapper
            else
              echo "ERROR: No Gradle project found in repository root."
              echo "Check the project folder and settings.gradle location."
              ls -la
              exit 1
            fi
          fi

          chmod +x gradlew
          echo "Gradle Wrapper is ready."

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Al-Hindwan-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
```

